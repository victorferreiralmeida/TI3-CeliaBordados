<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Realizado com Sucesso!</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <style>
        body {
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .success-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
        }
        .success-icon {
            color: #28a745;
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        .success-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .success-msg {
            color: #555;
            margin-bottom: 30px;
        }
        .btn-voltar {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1.1rem;
            transition: background 0.2s;
        }
        .btn-voltar:hover {
            background: #218838;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="success-title">Pedido realizado!</div>
        <div class="success-msg">
            Seu pedido foi registrado com sucesso.<br>
            Você será redirecionado para a página de pagamento do Mercado Pago em uma nova aba.<br>
            Após a confirmação do pagamento, seu pedido será processado.<br><br>
            Obrigado por comprar com a Célia Bordados!
        </div>
        <a href="index.html" class="btn-voltar">Voltar para a loja</a>
    </div>
</body>
</html>
